name: 경유노선 캐시 채우기

# 길찾기는 정류장 여러 곳의 경유노선을 한꺼번에 본다. 캐시가 비어 있으면
# 첫 조회가 10~21초까지 걸리므로 미리 채워둔다.
#
# 정류소가 3,615곳이고 한 곳당 2초 남짓 걸려 한 번에 다 받으면 2시간이 넘는다.
# 도착정보 수집이 같은 API 키를 쓰므로 트래픽도 나눠 써야 한다.
# 그래서 매일 새벽(운행이 적어 수집 부담이 낮은 시간)에 일정량씩 채운다.
# 며칠이면 전체가 채워지고, 그 뒤로는 새로 생긴 정류소만 받는다.
on:
  schedule:
    - cron: '0 18 * * *' # KST 03:00
  workflow_dispatch:
    inputs:
      limit:
        description: '이번에 받을 정류소 수'
        required: false
        default: '800'

concurrency:
  group: warm-routes
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 경유노선 수집
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        # 이미 채워진 정류소는 스크립트가 건너뛴다. 중단돼도 다음 실행이 이어받는다.
        run: pnpm warm:routes --limit ${{ github.event.inputs.limit || '800' }}
